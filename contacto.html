<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Contacto</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-header">
                <h1>Formulario de Contacto</h1>
                <button class="theme-toggle" id="themeToggle" title="Alternar modo día/noche" aria-label="Alternar modo día/noche">🌙</button>
            </div>

            <form id="contactForm" novalidate>
                <div class="form-group">
                    <label for="nombre">Nombre completo <span class="required-dot">*</span></label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej: María García López" required>
                </div>

                <div class="form-group">
                    <label for="servicio">Servicio <span class="required-dot">*</span></label>
                    <select id="servicio" name="servicio" required>
                        <option value="" disabled selected>Selecciona un servicio</option>
                        <option value="Consultoría Digital">Consultoría Digital</option>
                        <option value="Soluciones Multiexperiencia">Soluciones Multiexperiencia</option>
                        <option value="Evolución de Ecosistemas">Evolución de Ecosistemas</option>
                        <option value="Soluciones Low-Code">Soluciones Low-Code</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="mensaje">Mensaje <span class="required-dot">*</span></label>
                    <textarea id="mensaje" name="mensaje" placeholder="Cuéntanos sobre tu proyecto o consulta..." required></textarea>
                </div>

                <button type="submit" class="submit-btn">Enviar mensaje</button>
            </form>

            <p class="form-footer">La respuesta se mostrará en la consola del navegador</p>
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
